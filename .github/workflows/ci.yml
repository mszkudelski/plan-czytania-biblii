name: CI
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:
permissions:
  contents: read
  statuses: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  select-e2e:
    name: Select E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.selection.outputs.mode }}
      files: ${{ steps.selection.outputs.files }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify E2E selection regressions
        run: node --test scripts/*.node-test.mjs
      - name: Select tests from the commit changes
        id: selection
        run: node scripts/select-e2e.mjs
  unit-build:
    name: Unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
  e2e-backend:
    needs: [select-e2e, unit-build, production-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: E2E with real backend
    concurrency:
      group: backend-e2e-${{ github.event.pull_request.head.sha || github.sha }}
      cancel-in-progress: false
    # Keep browser dependencies compatible with the locked Playwright version.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci --prefix e2e
      - run: npm exec --prefix e2e -- playwright install --with-deps chromium
      - name: Wait for the deployment of the tested commit
        id: deploy
        env:
          GITHUB_TOKEN: ${{ github.token }}
          E2E_COMMIT: ${{ github.sha }}
        run: node scripts/wait-for-e2e-deploy.mjs
      - name: Browser and API regressions against deployed backend
        env:
          E2E_BASE_URL: ${{ steps.deploy.outputs.base_url }}
          E2E_PRODUCTION: '1'
          EXPECTED_COMMIT: ${{ github.sha }}
          E2E_MODE: ${{ needs.select-e2e.outputs.mode }}
          E2E_TEST_FILES: ${{ needs.select-e2e.outputs.files }}
        run: node scripts/run-selected-e2e.mjs
      - name: Clean up this run's synthetic plans, also after test failure
        if: always()
        run: node scripts/cleanup-e2e.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
  production-smoke:
    name: Production read-only checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify the production commit, assets and API without writes
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          PRODUCTION_BASE_URL: https://plan-czytania.netlify.app
        run: node scripts/check-production.mjs
  required-ci:
    name: Required CI
    if: always()
    needs: [select-e2e, unit-build, e2e-backend, production-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Require every test job to pass
        env:
          SELECTION_RESULT: ${{ needs.select-e2e.result }}
          SELECTION_MODE: ${{ needs.select-e2e.outputs.mode }}
          UNIT_RESULT: ${{ needs.unit-build.result }}
          E2E_RESULT: ${{ needs.e2e-backend.result }}
          PRODUCTION_RESULT: ${{ needs.production-smoke.result }}
          PRODUCTION_PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          test "$SELECTION_RESULT" = success
          test "$UNIT_RESULT" = success
          if [ "$PRODUCTION_PUSH" = true ]; then
            test "$SELECTION_MODE" = all
            test "$E2E_RESULT" = success
            test "$PRODUCTION_RESULT" = success
          else
            test "$SELECTION_MODE" = none
            test "$E2E_RESULT" = skipped
            test "$PRODUCTION_RESULT" = skipped
          fi
